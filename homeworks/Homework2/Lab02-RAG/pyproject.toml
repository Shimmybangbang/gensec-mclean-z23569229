[project]
name = "lab02-rag"
version = "0.1.0"
description = "Homework 2: a NotebookLM-style LangChain RAG application, built from the Lab 02.3 07_RAG example code."
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.1",
    "langchain>=1.4.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "bs4>=0.0.2",
    "chainlit>=2.12.0",
    "docx2txt>=0.9",
    "markdown>=3.10.3",
    "nltk>=3.10.3",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "scikit-learn>=1.9.1",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.6",
    "wikipedia>=1.4.0",
    "youtube-transcript-api>=1.2.4",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
